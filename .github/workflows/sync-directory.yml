name: Sync people and research references
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: directory-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Refresh identities and related research
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/import_people.py --zenodo --write
            python scripts/sync_catalogues.py
            python -m unittest discover -s tests -v
            python scripts/build_site.py
            git add -- data/people.json data/catalogues.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore: refresh people and IRP references'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Directory push failed. Check branch rules and rerun.' >&2
          exit 1
      - name: Request Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
